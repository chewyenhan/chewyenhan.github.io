<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700;900&family=Noto+Serif+SC:wght@300;400;600;700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   IMPERIAL FRENCH THEME — NAPOLEONIC WAR COUNCIL V3 (PAGE-BASED)
   ============================================================ */
:root {
  --bg: #06080f; --bg2: #0c0f1a; --panel: #111422;
  --gold: #c9a44c; --gold2: #e0c870; --gold3: #8b6914;
  --red: #991a1a; --red2: #c0392b;
  --cream: #f0e6d0; --cream2: #d4c5a0;
  --blue: #1a2755;
  --text: #e5ddd0; --dim: #8a8278;
  --border: #2a2218;
  --green: #4a7c3f; --orange: #c08030;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; }

body {
  font-family: 'Noto Serif SC', serif;
  background: var(--bg);
  color: var(--text);
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
}

/* ── Background & Effects ── */
#bg {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background-size: cover;
  background-position: center;
  opacity: 0.4;
  pointer-events: none;
  z-index: 0;
  transition: opacity 0.8s ease;
}

#embers {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
}

#veil {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(0,0,0,0.6) 50%, rgba(0,0,0,0.8) 100%);
  pointer-events: none;
  z-index: 1;
}

/* ── App Container ── */
#app {
  position: relative;
  z-index: 2;
  width: 100%;
  max-width: 900px;
  height: 100vh;
  max-height: 700px;
  display: flex;
  flex-direction: column;
  padding: 15px;
  gap: 10px;
}

/* ── Top Stats Bar ── */
#topbar {
  display: flex;
  gap: 10px;
  flex-shrink: 0;
  background: linear-gradient(135deg, rgba(17,20,34,0.8), rgba(6,8,15,0.9));
  border: 1px solid var(--border);
  border-radius: 8px;
  padding: 12px 16px;
  box-shadow: 0 2px 20px rgba(0,0,0,0.4);
  position: relative;
  overflow: hidden;
}

#topbar::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 1px;
  background: linear-gradient(90deg, transparent, var(--gold3), var(--gold), var(--gold3), transparent);
}

.stat {
  flex: 1;
  text-align: center;
  position: relative;
}

.stat .lbl {
  font-family: 'Cinzel', serif;
  font-size: 10px;
  letter-spacing: 2px;
  color: var(--dim);
  text-transform: uppercase;
}

.stat .val {
  font-family: 'Cinzel', serif;
  font-size: 22px;
  font-weight: 700;
  color: var(--gold2);
  line-height: 1.2;
}

.stat .bar {
  height: 3px;
  background: rgba(255, 255, 255, 0.05);
  border-radius: 2px;
  margin-top: 4px;
  overflow: hidden;
}

.stat .bar .fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.6s cubic-bezier(0.4, 0, 0.2, 1);
}

.fill.stb { background: linear-gradient(90deg, var(--red2), var(--orange), var(--gold), var(--green)); }
.fill.arm { background: linear-gradient(90deg, var(--red2), var(--orange), var(--gold2)); }

/* ── Main Panel ── */
#panel {
  flex: 1;
  background: linear-gradient(135deg, rgba(17,20,34,0.7), rgba(15,18,30,0.8));
  border: 1px solid var(--border);
  border-radius: 10px;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  box-shadow: 0 0 80px rgba(180,150,80,0.04), inset 0 0 120px rgba(0,0,0,0.4);
  position: relative;
}

#panel::before, #panel::after {
  content: '⚜️';
  position: absolute;
  font-size: 28px;
  opacity: 0.12;
  z-index: 0;
  pointer-events: none;
}

#panel::before { top: 10px; left: 16px; }
#panel::after { bottom: 10px; right: 16px; transform: rotate(180deg); }

/* ── Page Content Area ── */
#pageContent {
  flex: 1;
  overflow-y: auto;
  padding: 20px;
  display: flex;
  flex-direction: column;
  gap: 15px;
  scroll-behavior: smooth;
  animation: fadeIn 0.5s ease-out;
}

#pageContent::-webkit-scrollbar {
  width: 4px;
}

#pageContent::-webkit-scrollbar-track {
  background: transparent;
}

#pageContent::-webkit-scrollbar-thumb {
  background: var(--border);
  border-radius: 2px;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(5px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Page Image ── */
#pageImage {
  width: 100%;
  max-height: 250px;
  border-radius: 8px;
  object-fit: cover;
  border: 1px solid var(--gold3);
  box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
  animation: slideDown 0.6s ease-out;
}

@keyframes slideDown {
  from { opacity: 0; transform: translateY(-10px); }
  to { opacity: 1; transform: translateY(0); }
}

/* ── Page Title ── */
#pageTitle {
  font-family: 'Cinzel', serif;
  font-size: 24px;
  font-weight: 700;
  color: var(--gold2);
  text-align: center;
  text-transform: uppercase;
  letter-spacing: 2px;
  margin: 10px 0;
}

/* ── Page Text ── */
#pageText {
  font-size: 15px;
  line-height: 1.8;
  color: var(--text);
  text-align: left;
  padding: 10px;
  background: rgba(0, 0, 0, 0.2);
  border-left: 3px solid var(--gold);
  border-radius: 4px;
}

/* ── Choices Area ── */
#choices {
  padding: 12px 18px 16px;
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  background: linear-gradient(0deg, rgba(0,0,0,0.5), transparent);
  display: flex;
  flex-direction: column;
  gap: 8px;
  max-height: 35%;
  overflow-y: auto;
}

#choices::-webkit-scrollbar {
  width: 3px;
}

#choices::-webkit-scrollbar-thumb {
  background: var(--gold3);
  border-radius: 2px;
}

.btn {
  width: 100%;
  padding: 12px 14px;
  text-align: left;
  background: linear-gradient(135deg, rgba(30,35,55,0.5), rgba(15,18,30,0.7));
  border: 1px solid var(--border);
  border-radius: 6px;
  color: var(--text);
  font-family: 'Noto Serif SC', serif;
  font-size: 14px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
  display: flex;
  align-items: center;
  gap: 10px;
}

.btn:hover {
  border-color: var(--gold3);
  background: linear-gradient(135deg, rgba(201,164,76,0.12), rgba(30,35,55,0.3));
  transform: translateX(3px);
}

.btn:active {
  transform: scale(0.98);
}

.btn .lt {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 28px;
  height: 28px;
  background: var(--gold3);
  color: #000;
  font-family: 'Cinzel', serif;
  font-weight: 700;
  font-size: 12px;
  border-radius: 3px;
  flex-shrink: 0;
}

.btn:hover .lt {
  background: var(--gold);
}

.btn span:last-child {
  flex: 1;
}

/* ── Navigation Buttons ── */
#navBar {
  display: flex;
  gap: 8px;
  flex-shrink: 0;
  padding: 10px;
  justify-content: space-between;
}

.navBtn {
  padding: 10px 18px;
  background: linear-gradient(135deg, var(--gold3), #8b6914);
  border: 1px solid var(--gold);
  border-radius: 6px;
  color: #000;
  font-family: 'Cinzel', serif;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.2s;
  font-size: 13px;
}

.navBtn:hover {
  background: linear-gradient(135deg, var(--gold), var(--gold2));
  transform: translateY(-2px);
}

.navBtn:disabled {
  opacity: 0.3;
  cursor: not-allowed;
}

.navBtn.hidden {
  display: none;
}

/* ── Loading Screen ── */
#loading {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: rgba(0, 0, 0, 0.8);
  display: none;
  align-items: center;
  justify-content: center;
  z-index: 100;
  backdrop-filter: blur(2px);
}

#loading.on {
  display: flex;
}

.loadingContent {
  text-align: center;
}

.loadingSpinner {
  width: 50px;
  height: 50px;
  border: 3px solid var(--gold3);
  border-top-color: var(--gold);
  border-radius: 50%;
  animation: spin 1s linear infinite;
  margin: 0 auto 15px;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}

.loadingText {
  color: var(--gold2);
  font-family: 'Cinzel', serif;
  font-size: 14px;
  letter-spacing: 2px;
}

/* ── Responsive ── */
@media (max-width: 768px) {
  #app {
    max-width: 100%;
    max-height: 100vh;
    padding: 10px;
  }
  
  #topbar {
    padding: 10px 12px;
  }
  
  .stat .val {
    font-size: 18px;
  }
  
  #pageTitle {
    font-size: 18px;
  }
  
  #pageText {
    font-size: 14px;
  }
}
</style>
</head>

// ─────────────────────────────────────────────────────────────
// AUDIO SYSTEM - Background Music & Voice
// ─────────────────────────────────────────────────────────────

let audioCtx = null;
let musicPlaying = false;
let musicNodes = [];

function initAudio() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
}

function playBackgroundMusic() {
  if (musicPlaying) return;
  musicPlaying = true;
  initAudio();
  
  // Procedural orchestral music (inspired by Beethoven)
  const t = audioCtx.currentTime;
  const master = audioCtx.createGain();
  master.gain.value = 0.15;
  master.connect(audioCtx.destination);
  
  // Bass drone
  const bass = audioCtx.createOscillator();
  const bassGain = audioCtx.createGain();
  bass.type = 'sine';
  bass.frequency.value = 55; // A1
  bassGain.gain.value = 0.1;
  bass.connect(bassGain);
  bassGain.connect(master);
  bass.start();
  musicNodes.push(bass, bassGain);
  
  // String pad
  const pad = audioCtx.createOscillator();
  const padGain = audioCtx.createGain();
  pad.type = 'triangle';
  pad.frequency.value = 220; // A3
  padGain.gain.value = 0.08;
  pad.connect(padGain);
  padGain.connect(master);
  pad.start();
  musicNodes.push(pad, padGain);
  
  // Melody line (horn)
  const horn = audioCtx.createOscillator();
  const hornGain = audioCtx.createGain();
  const hornFilter = audioCtx.createBiquadFilter();
  horn.type = 'sawtooth';
  horn.frequency.value = 440; // A4
  hornFilter.type = 'lowpass';
  hornFilter.frequency.value = 1200;
  hornGain.gain.value = 0.05;
  horn.connect(hornFilter);
  hornFilter.connect(hornGain);
  hornGain.connect(master);
  horn.start();
  musicNodes.push(horn, hornGain, hornFilter);
}

function stopBackgroundMusic() {
  if (!musicPlaying) return;
  musicNodes.forEach(node => {
    try { node.stop(); } catch (e) {}
  });
  musicNodes = [];
  musicPlaying = false;
}

function speak(text) {
  if (!('speechSynthesis' in window)) return;
  
  speechSynthesis.cancel();
  const clean = text.replace(/[\u{1F300}-\u{1F9FF}]/gu, '').replace(/<[^>]*>/g, '').trim();
  if (!clean || clean.length < 2) return;
  
  const utterance = new SpeechSynthesisUtterance(clean);
  utterance.lang = 'zh-CN';
  utterance.rate = 0.9;
  utterance.pitch = 0.95;
  utterance.volume = 0.8;
  
  const voices = speechSynthesis.getVoices();
  const zhVoice = voices.find(v => v.lang === 'zh-CN' || v.lang.startsWith('zh')) || voices[0];
  if (zhVoice) utterance.voice = zhVoice;
  
  speechSynthesis.speak(utterance);
}

// Ensure voices are loaded
if ('speechSynthesis' in window) {
  speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices();
}

function updateStats() {
  document.getElementById('sv').textContent = G.stability;
  document.getElementById('sb').style.width = Math.max(0, G.stability) + '%';
  
  document.getElementById('av').textContent = G.army >= 10000 ? Math.round(G.army / 10000) + '万' : G.army;
  document.getElementById('ab').style.width = Math.max(0, G.army / 6000) + '%';
  
  document.getElementById('tv').textContent = G.trust;
}

function goToPage(pageId) {
  if (!PAGES[pageId]) return;
  
  G.history.push(G.currentPage);
  G.currentPage = pageId;
  
  renderPage(pageId);
  updateStats();
  updateNavigationButtons();
}

function goToPreviousPage() {
  if (G.history.length > 0) {
    const prevPageId = G.history.pop();
    G.currentPage = prevPageId;
    renderPage(prevPageId);
    updateStats();
    updateNavigationButtons();
  }
}

function goToNextPage() {
  const page = PAGES[G.currentPage];
  if (page && page.choices && page.choices.length === 1) {
    const choice = page.choices[0];
    if (choice.target) {
      goToPage(choice.target);
    }
  }
}

function renderPage(pageId) {
  const page = PAGES[pageId];
  if (!page) return;
  
  // Update background image
  const bg = document.getElementById('bg');
  if (page.image) {
    bg.style.backgroundImage = `url('${page.image}')`;
  }
  
  // Update title
  const titleEl = document.getElementById('pageTitle');
  titleEl.textContent = page.title || '';
  
  // Update image
  const imgEl = document.getElementById('pageImage');
  if (page.image) {
    imgEl.src = page.image;
    imgEl.style.display = 'block';
  } else {
    imgEl.style.display = 'none';
  }
  
  // Update content
  const contentEl = document.getElementById('pageText');
  contentEl.innerHTML = page.content || '';
  
  // Read content aloud (for story pages only)
  if (page.type === 'story' && page.content) {
    setTimeout(() => {
      speak(page.content);
    }, 800);
  }
  
  // Update choices
  const choicesEl = document.getElementById('choices');
  choicesEl.innerHTML = '';
  
  if (page.choices && page.choices.length > 0) {
    page.choices.forEach((choice, index) => {
      const btn = document.createElement('button');
      btn.className = 'btn';
      btn.innerHTML = `<span class="lt">${String.fromCharCode(65 + index)}</span><span>${choice.label}</span>`;
      btn.onclick = () => {
        if (choice.target) {
          // Apply effects BEFORE navigation
          if (choice.effects) {
            if (choice.effects.stability) G.stability = Math.max(0, Math.min(100, G.stability + choice.effects.stability));
            if (choice.effects.army) G.army = Math.max(0, G.army + choice.effects.army);
            if (choice.effects.trust) G.trust = Math.max(-100, Math.min(100, G.trust + choice.effects.trust));
            if (choice.effects.cc) G.cc += choice.effects.cc;
            if (choice.effects.wc) G.wc += choice.effects.wc;
            if (choice.effects.route) G.route = choice.effects.route;
            if (choice.effects.hasSupply !== undefined) G.hasSupply = choice.effects.hasSupply;
          }
          // If page has effects and no target has its own, apply page effects
          else if (page.effects) {
            if (page.effects.stability) G.stability = Math.max(0, Math.min(100, G.stability + page.effects.stability));
            if (page.effects.army) G.army = Math.max(0, G.army + page.effects.army);
            if (page.effects.trust) G.trust = Math.max(-100, Math.min(100, G.trust + page.effects.trust));
            if (page.effects.cc) G.cc += page.effects.cc;
            if (page.effects.wc) G.wc += page.effects.wc;
            if (page.effects.route) G.route = page.effects.route;
            if (page.effects.hasSupply !== undefined) G.hasSupply = page.effects.hasSupply;
          }
          goToPage(choice.target);
        }
      };
      choicesEl.appendChild(btn);
    });
  }
  
  // Scroll to top
  document.getElementById('pageContent').scrollTop = 0;
}

function updateNavigationButtons() {
  const backBtn = document.getElementById('backBtn');
  const nextBtn = document.getElementById('nextBtn');
  
  backBtn.disabled = G.history.length === 0;
  
  const page = PAGES[G.currentPage];
  if (page && page.choices && page.choices.length === 1) {
    nextBtn.style.display = 'block';
    nextBtn.disabled = false;
  } else {
    nextBtn.style.display = 'none';
  }
}

// ─────────────────────────────────────────────────────────────
// PARTICLES & ANIMATIONS
// ─────────────────────────────────────────────────────────────

(function() {
  const c = document.getElementById('embers');
  const cx = c.getContext('2d');
  c.width = window.innerWidth;
  c.height = window.innerHeight;
  
  const particles = Array.from({ length: 45 }, () => ({
    x: Math.random() * c.width,
    y: Math.random() * c.height,
    r: Math.random() * 1.8 + 0.4,
    dy: Math.random() * 0.25 + 0.05,
    a: Math.random() * 0.5 + 0.1,
    ph: Math.random() * Math.PI * 2
  }));
  
  function loop() {
    cx.clearRect(0, 0, c.width, c.height);
    particles.forEach(p => {
      p.y -= p.dy;
      p.a = 0.12 + Math.sin(Date.now() * 0.0008 + p.ph) * 0.08;
      if (p.y < -5) {
        p.y = c.height + 5;
        p.x = Math.random() * c.width;
      }
      cx.fillStyle = `rgba(220,180,100,${p.a})`;
      cx.beginPath();
      cx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
      cx.fill();
    });
    requestAnimationFrame(loop);
  }
  
  loop();
  
  window.addEventListener('resize', () => {
    c.width = window.innerWidth;
    c.height = window.innerHeight;
  });
})();
